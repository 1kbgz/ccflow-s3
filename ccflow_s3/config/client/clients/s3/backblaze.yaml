# @package client

_target_: ccflow_s3.S3Client
provider:
  _target_: ccflow_s3.S3Provider
  name: backblaze
  endpoint_url_env: BACKBLAZE_S3_ENDPOINT_URL
  region_name_env: BACKBLAZE_S3_REGION
credentials:
  _target_: ccflow_s3.S3ClientCredentials
  mode: env
  access_key_id_env: BACKBLAZE_ACCESS_KEY_ID
  secret_access_key_env: BACKBLAZE_SECRET_ACCESS_KEY
