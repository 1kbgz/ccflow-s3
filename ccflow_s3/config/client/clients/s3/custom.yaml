# @package client

_target_: ccflow_s3.S3Client
provider:
  _target_: ccflow_s3.S3Provider
  name: custom
  endpoint_url_env: S3_ENDPOINT_URL
  region_name_env: S3_REGION
credentials:
  _target_: ccflow_s3.S3ClientCredentials
  mode: env
  access_key_id_env: S3_ACCESS_KEY_ID
  secret_access_key_env: S3_SECRET_ACCESS_KEY
  session_token_env: S3_SESSION_TOKEN
  region_name_env: S3_REGION
